# Every port is published on 127.0.0.1 only: reach the databases from this machine
# (or through an SSH tunnel), never from the internet. Passwords come from .env
# (POSTGRES_PASSWORD, NEO4J_PASSWORD, MINIO_ACCESS_KEY, MINIO_SECRET_KEY); there are no defaults.
services:
  neo4j:
    image: neo4j:latest
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      # Browser must connect to localhost, not 0.0.0.0 (fixes "No routing servers" error)
      - NEO4J_server_bolt_listen__address=0.0.0.0:7687
      - NEO4J_server_bolt_advertised__address=127.0.0.1:7687
      - NEO4J_server_http_listen__address=0.0.0.0:7474
      - NEO4J_server_http_advertised__address=127.0.0.1:7474
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: navigator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: compliance_navigator
    ports:
      # 5433 on the host so it doesn't clash with other local Postgres instances
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navigator -d compliance_navigator"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
    volumes:
      - minio_data:/data

  web:
    build: .
    # Put a TLS reverse proxy (nginx, Caddy) in front; it reaches the API on 127.0.0.1:8080
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      # Inside the compose network the services are reached by name, not localhost
      NEO4J_URI: bolt://neo4j:7687
      REDIS_HOST: redis
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DATABASE_URL: postgresql://navigator:${POSTGRES_PASSWORD}@postgres:5432/compliance_navigator
      # Trust X-Forwarded-For only from the proxy on the docker bridge
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.16.0.0/12}
    volumes:
      # Uploaded files (including national ID copies) live on a volume, never in the image
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    build: .
    command: celery -A worker.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      REDIS_HOST: redis
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DATABASE_URL: postgresql://navigator:${POSTGRES_PASSWORD}@postgres:5432/compliance_navigator
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
  qdrant_data:
  minio_data:
  uploads:
