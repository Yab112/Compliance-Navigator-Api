[project]
name = "fastapi-neo4j"
version = "0.1.0"
description = "Compliance Navigator API (FastAPI and Postgres)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "celery[redis]>=5.4.0",
    "config>=0.5.1",
    "fastapi>=0.115.13",
    "redis>=5.0.0",
    "numpy>=2.3.0",
    "passlib>=1.7.4",
    "pydantic-settings>=2.9.1",
    "pydantic[email]>=2.11.7",
    "pyjwt>=2.15.0",
    "python-multipart>=0.0.22",
    "uvicorn>=0.34.3",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "fastembed>=0.5.0",
    "boto3>=1.35.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "faster-whisper>=1.1.0",
    "psycopg[binary,pool]>=3.2",
    "bcrypt>=4.2",
    "scikit-learn>=1.9.1",
    "joblib>=1.6.0",
    "cryptography>=46",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
# Only for scripts/copy_graph_from_neo4j.py (the one-time move off Neo4j): uv sync --group migrate
migrate = [
    "neo4j>=5.28",
]
