[project]
name = "fastapi-neo4j"
version = "0.1.0"
description = "A simple starter for building RESTful APIs with FastAPI and NEO4J."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "celery[redis]>=5.4.0",
    "config>=0.5.1",
    "fastapi>=0.115.13",
    "redis>=5.0.0",
    "neontology>=2.1.0",
    "numpy>=2.3.0",
    "passlib>=1.7.4",
    "pydantic-settings>=2.9.1",
    "pydantic[email]>=2.11.7",
    "pyjwt>=2.10.1",
    "python-multipart>=0.0.20",
    "uvicorn>=0.34.3",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "supabase>=2.10.0",
    "fastembed>=0.5.0",
    "boto3>=1.35.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "faster-whisper>=1.1.0",
]
